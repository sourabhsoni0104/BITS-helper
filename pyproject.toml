[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bits-academic-recommender"
version = "0.1.0"
description = "Evidence-grounded academic course recommendation engine"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
bits-recommender = "recommender.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-p no:libtmux"
